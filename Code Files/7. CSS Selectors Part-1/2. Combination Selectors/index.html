<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Part-1 (Combination Selectors)</title>

    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Adjacent Sibling Combinator -->
    <h1>I am h1</h1>
    <p>I am paragraph</p>
    <p>I am paragraph2</p>

    <hr>
    
     <h1>I am h1</h1>
    <p>I am paragraph</p>

    <hr>

     <h1>I am h1</h1>
    <p>I am paragraph</p>

    <hr>

     <h1>I am h1</h1>
    <p>I am paragraph</p>

    <hr>


    <!-- Child Combinator -->
     <div>
        <p>I am inner paragraph</p>

        <span>
            <p>I am paragraph 6</p>
            <p>I am paragraph 7</p>
        </span>
        
        <!-- inner div -->
        <div>
            <p>I am paragraph2</p>

            <span>
                <p>I am paragraph 3</p>
            </span>

            <p>I am paragraph 4</p>
        </div>

        <p>I am paragraph5</p>
     </div>
</body>
</html>
